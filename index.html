<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: none;
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {

	cursor:    -moz-grab;

.leaflet-popup-pane,

.leaflet-marker-icon,

.leaflet-image-layer,

.leaflet-tile-container {

.leaflet-marker-icon.leaflet-interactive,

.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

/* visual tweaks */

.leaflet-container {

.leaflet-zoom-box {

/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	display: block;
	text-align: center;

.leaflet-bar a,

.leaflet-bar a:hover,

.leaflet-touch .leaflet-bar a {

/* zoom control */

.leaflet-control-zoom-in,

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {

	}


/* layers control */

.leaflet-control-layers {

.leaflet-control-layers-toggle {

/* Default icon URLs */

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-control-scale-line:not(:first-child):not(:last-child) {

	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);

	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;

.leaflet-popup-content {

.leaflet-popup-tip-container {

.leaflet-popup-tip {

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

.leaflet-container a.leaflet-popup-close-button {

.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,

/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;

	-webkit-user-select: none;

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;

<style>:root{
  --navy:#0b1f3a;--navy2:#13335c;--taxi:#ffc20e;--teal:#16a085;--red:#e63946;--gold:#d4af37;
  --bg:#f3f6fb;--card:#fff;--ink:#16202e;--mute:#5d6b80;--line:#e3e9f2;
  --acc:#13335c;--acc2:#2b6cb0;
  --r:16px;--shadow:0 4px 14px rgba(11,31,58,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);direction:rtl;font-size:15px;line-height:1.5;
  min-height:100vh;padding-top:84px;padding-bottom:40px}
a{color:var(--acc2);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block;text-align:left}
/* ---------- header ---------- */
#top{position:fixed;top:0;right:0;left:0;z-index:1000;background:linear-gradient(100deg,var(--navy),var(--navy2) 60%,#1c4a85);color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.25)}
#bar{display:flex;align-items:center;gap:8px;height:42px;padding:0 10px}
#bar .logo{width:30px;height:30px;border-radius:8px;flex:none}
#bar .ttl{font-weight:800;font-size:15px;white-space:nowrap}
#bar .by{font-size:12px;opacity:.95;white-space:nowrap;margin-inline-start:4px}
.gold{background:linear-gradient(180deg,#fff3b0,#f5c518 45%,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;text-shadow:0 0 1px rgba(212,175,55,.35)}
#bar .sp{flex:1}
.ibtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;height:30px;min-width:30px;padding:0 8px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.ibtn:active{background:rgba(255,255,255,.3)}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(-360deg)}}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:0 6px 5px;scrollbar-width:none;height:42px;align-items:center}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:rgba(255,255,255,.10);color:#dfe9f7;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--taxi);color:#1a1a1a}
/* ---------- layout ---------- */
main{max-width:1100px;margin:0 auto;padding:12px}
section.pane{display:none;animation:fd .25s}
section.pane.on{display:block}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.hero{border-radius:20px;padding:16px 16px 14px;color:#fff;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero h2{margin:0 0 2px;font-size:20px}
.hero p{margin:0;opacity:.95;font-size:13.5px}
.hero .em{position:absolute;left:10px;top:-4px;font-size:70px;opacity:.22;transform:rotate(-12deg)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.item{display:flex;flex-direction:column}
.item .ph{height:150px;background:linear-gradient(135deg,var(--c1,#13335c),var(--c2,#2b6cb0));position:relative;display:flex;align-items:center;justify-content:center;font-size:54px;color:#fff;overflow:hidden}
.item .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.item .ph img.ok{opacity:1}
.item .ph .badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;z-index:2}
.item .ph .free{position:absolute;top:8px;left:8px;background:#16a34a;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;z-index:2;font-weight:700}
.item .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.item h3{margin:0;font-size:16px;line-height:1.25}
.item .en{font-size:12.5px;color:var(--mute);direction:ltr;text-align:right}
.item .tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;background:#eef3fb;color:#24406b;padding:2px 8px;border-radius:10px}
.tag.y{background:#fff4cc;color:#6b4e00}.tag.g{background:#dcfce7;color:#14532d}.tag.r{background:#ffe4e6;color:#9f1239}
.item .acts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.btn{border:0;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;background:var(--acc);color:#fff;display:inline-flex;gap:4px;align-items:center;justify-content:center}
.btn.alt{background:#eef3fb;color:var(--acc)}
.btn.tx{background:var(--taxi);color:#222}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.red{background:var(--red)}
.btn[disabled]{opacity:.5}
.grow{flex:1}
/* filters */
.filt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:10px;box-shadow:var(--shadow)}
.filt .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:3px 0}
.chip{border:1px solid #cfd9ea;background:#fff;color:#24406b;border-radius:16px;padding:4px 11px;font-size:12.5px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.filt input[type=search],.filt select,.fld,.fld-ta{border:1px solid #cfd9ea;border-radius:10px;padding:7px 10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.filt input[type=search]{flex:1;min-width:140px}
.cnt{font-size:12px;color:var(--mute)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,15,30,.6);z-index:2000;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#sheet .x{position:sticky;top:0;float:left;margin:8px;z-index:5;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:18px}
.dh{height:230px;position:relative;background:linear-gradient(135deg,var(--c1,#13335c),var(--c2,#2b6cb0));display:flex;align-items:center;justify-content:center;font-size:80px;color:#fff;overflow:hidden}
.dh img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.dh img.ok{opacity:1}
.db{padding:12px 16px 24px}
.db h2{margin:0}
.db .en{direction:ltr;text-align:right;color:var(--mute);font-size:13px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:10px 0;font-size:14px}
.kv b{color:var(--acc);white-space:nowrap}
.more{border:1px dashed #b7c6df;border-radius:12px;padding:8px 10px;margin:8px 0;background:#f8fbff}
.more summary{font-weight:700;cursor:pointer;color:var(--acc)}
.note{background:#fff7e0;border:1px solid #f3d98a;border-radius:12px;padding:8px 10px;font-size:13px;margin:8px 0}
.note.b{background:#e8f1ff;border-color:#b6d0fb}
.note.g{background:#e8fbef;border-color:#a8e6bf}
.note.r{background:#ffecee;border-color:#f6b3ba}
/* map */
#mapbox{height:62vh;min-height:360px;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.mk{font-size:20px;line-height:1;background:#fff;border:2px solid var(--c,#13335c);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.st{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #333}
.leaflet-popup-content{direction:rtl;font-family:inherit;min-width:190px}
.pop h4{margin:0 0 2px}
.pop .btn{margin:4px 2px 0 0}
.pop img{width:100%;height:90px;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px}
/* lines */
.lines{display:flex;gap:4px;flex-wrap:wrap}
.ln{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;padding:0 5px;color:#fff;font-weight:800;font-size:12px}
.ln.dark{color:#111}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:right;vertical-align:top}
table.t th{background:#eef3fb;color:var(--acc)}
.sec{margin:16px 0 8px;font-size:17px;font-weight:800;color:var(--acc);display:flex;align-items:center;gap:6px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.wx{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.wx .d{background:linear-gradient(160deg,#e8f1ff,#fff);border:1px solid var(--line);border-radius:14px;text-align:center;padding:8px 4px}
.wx .d .e{font-size:30px}.wx .d b{display:block}
.now{display:flex;gap:12px;align-items:center;padding:12px}
.now .big{font-size:48px}
.now .t{font-size:34px;font-weight:800}
.clk{display:flex;gap:10px;flex-wrap:wrap}
.clk div{flex:1;min-width:130px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.clk b{font-size:22px;display:block}
.day{margin:10px 0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.day h4{margin:0;padding:8px 12px;background:linear-gradient(100deg,var(--navy),var(--navy2));color:#fff;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.stop{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.stop .tm{font-weight:800;color:var(--acc);min-width:44px}
.stop .go{font-size:12px;color:var(--mute)}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700;color:var(--acc)}
.fld{width:100%}
#toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:#111c;color:#fff;padding:8px 16px;border-radius:20px;z-index:3000;font-size:13px;display:none;max-width:90%;backdrop-filter:blur(4px)}
footer{text-align:center;color:var(--mute);font-size:12px;padding:16px 8px}
.empty{padding:26px;text-align:center;color:var(--mute)}
.stars{color:#f5a623;letter-spacing:1px}
@media(min-width:700px){#sheet{border-radius:22px;margin-bottom:4vh;align-self:center}#modal{align-items:center}body{padding-top:88px}}
@media print{#top,.filt,.acts,#toast,footer{display:none!important}body{padding:0}section.pane{display:block!important}}
.ph2{height:90px;border-radius:8px;position:relative;overflow:hidden;margin-bottom:4px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff}
.ph2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#mapbox,#metrobox{isolation:isolate}
.leaflet-container{font-family:inherit}
.more[open]{background:#fff}
#last{font-size:10.5px;opacity:.85;white-space:nowrap}
#wxmini{font-size:13px}
@media(max-width:420px){#bar .ttl{font-size:13.5px}#last{display:none}}

/* --- enhancements 20261114 --- */
.btn-today{background:linear-gradient(90deg,#f5c518,#ff9f1c);color:#1a1a1a;font-weight:800;border:0;border-radius:12px;padding:8px 14px;font-size:13.5px;box-shadow:0 2px 8px rgba(245,197,24,.4)}
.btn-today:active{transform:scale(.97)}
#mapbox.fs,#metrobox.fs{position:fixed!important;inset:0;z-index:1500;height:100vh!important;min-height:100vh!important;border-radius:0!important;border:0!important}
.fs-exit{position:fixed;top:12px;left:12px;z-index:1600;background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.phrase-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.phrase-tbl th,.phrase-tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:right;vertical-align:middle}
.phrase-tbl th{background:#eef3fb;color:var(--acc);position:sticky;top:0}
.phrase-tbl .ltr{direction:ltr;text-align:left;font-family:system-ui,sans-serif}
.spk{border:0;background:var(--acc);color:#fff;border-radius:50%;width:32px;height:32px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.spk:active{opacity:.8}
#pickModal{position:fixed;inset:0;background:rgba(5,15,30,.55);z-index:2100;display:none;align-items:flex-end;justify-content:center}
#pickModal.on{display:flex}
#pickSheet{background:#fff;width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:12px 14px 24px}
#pickSheet h3{margin:4px 0 10px}
.pick-cat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pick-item{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line);cursor:pointer}
.pick-item:active{background:#f0f5ff}
.pick-item .em{font-size:22px}
#todaySheet .day-rec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;box-shadow:var(--shadow)}


.cal-btn{border:1px solid #cfd9ea;background:#fff;border-radius:10px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;flex:none;padding:0}
.cal-btn:active{background:#eef3fb}
.date-wrap{display:flex;gap:6px;align-items:center}
.date-wrap input[type=date].cal-hidden{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.doc-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.mode-sel{border:1px solid #cfd9ea;border-radius:8px;padding:3px 6px;font-size:12px;font-family:inherit}


#planmap{height:360px;border-radius:14px;border:1px solid var(--line);margin:8px 0;overflow:hidden}
#planmap.fs{position:fixed!important;inset:0;z-index:1500;height:100vh!important;border-radius:0!important}
.day-dot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:800}
@media print{
  #top,.filt,.acts,#toast,footer,.btn,button,.cal-btn,#pl-saved input,#pl-doc-url,#pl-doc-desc,[data-act],.mode-sel{display:none!important}
  body{padding:0;background:#fff}
  section.pane{display:block!important}
  section.pane:not(#p-plan){display:none!important}
  #p-plan{display:block!important}
  .day{break-inside:avoid;page-break-inside:avoid}
  #planmap{height:280px;break-inside:avoid}
  .hero{box-shadow:none}
}

/* ===== עותק יחיד – מיקוד חלון קיים במקום לפתוח עוד אחד ===== */
(function singleInstance(){
  try{
    if(!('BroadcastChannel' in window)) return;
    const ch = new BroadcastChannel('nyc-guide-v1');
    let isPrimary = true;
    let responded = false;

    ch.onmessage = (ev) => {
      const d = ev.data || {};
      if(d.type === 'ping'){
        // אנחנו כבר פתוחים – עונים וממקדים את עצמנו
        ch.postMessage({type:'pong'});
        try{ window.focus(); }catch(e){}
        // הבאה לקידמת המסך גם אם הדפדפן מאפשר
        if(document.hidden) try{ window.focus(); }catch(e){}
      } else if(d.type === 'pong'){
        responded = true;
        isPrimary = false;
        // נמצא עותק אחר – מציגים הודעה ומנסים לסגור
        showAlreadyOpen();
      }
    };

    // שולחים ping – אם מישהו עונה, אנחנו העותק החדש
    ch.postMessage({type:'ping'});

    function showAlreadyOpen(){
      // מונע כפילות הודעות
      if(document.getElementById('single-inst-banner')) return;
      const ban = document.createElement('div');
      ban.id = 'single-inst-banner';
      ban.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(5,15,30,.75);display:flex;align-items:center;justify-content:center;padding:16px';
      ban.innerHTML = `<div style="background:#fff;border-radius:18px;padding:20px;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)">
        <div style="font-size:40px;margin-bottom:8px">📱</div>
        <h2 style="margin:0 0 8px;font-size:18px;color:#0b1f3a">האפליקציה כבר פתוחה</h2>
        <p style="margin:0 0 14px;color:#5d6b80;font-size:14px;line-height:1.45">זוהה עותק פעיל. העותק הקיים הובא לחזית. אפשר לסגור את החלון הזה.</p>
        <button id="single-close" style="border:0;background:#0b1f3a;color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer">סגור חלון זה</button>
      </div>`;
      document.documentElement.appendChild(ban);
      document.getElementById('single-close').onclick = () => {
        try{ window.close(); }catch(e){}
        // אם הדפדפן לא מאפשר close – מסתירים את הבאנר וממשיכים
        setTimeout(()=>{ ban.remove(); toast && toast('אם החלון לא נסגר – סגרו אותו ידנית'); }, 400);
      };
      // ניסיון סגירה אוטומטי אחרי רגע קצר (עובד רק בחלק מהמקרים)
      setTimeout(()=>{ try{ window.close(); }catch(e){} }, 700);
    }

    // אם תוך 450ms לא הגיעה תשובה – אנחנו העותק היחיד
    setTimeout(()=>{ if(!responded) isPrimary = true; }, 450);
  }catch(e){}
})();

const APX={JFK:{n:'JFK',st:'sut',pre:'AirTrain ($8.75) מהטרמינל לתחנה Sutphin Blvd–Archer Av (E/J/Z)'},LGA:{n:'LaGuardia',st:'jack',pre:'אוטובוס Q70 ($3) מהטרמינל לתחנה Jackson Hts–Roosevelt Av'},EWR:{n:'Newark',st:'penn',pre:'AirTrain ו-NJ Transit לתחנת Penn Station'}};
function resolve(v){const [t,id]=v.split(':');if(t==='ap'){const a=APX[id];const s=SD[a.st];return{ll:[s.lat,s.lng],n:'שדה '+a.n,ap:a}}if(t==='stn'){const s=SD[id];return{ll:[s.lat,s.lng],n:s.en}}const r=REG[id];return{ll:r.item.rll||r.item.ll,n:r.item.n}}
function pidx(l,id){return LINE_PATH[l]?LINE_PATH[l].indexOf(id):-1}
function ride(l,f,t){const i=pidx(l,f),j=pidx(l,t);if(i<0||j<0||i===j)return null;const P=LINE_PATH[l];return{line:l,from:f,to:t,stops:Math.abs(i-j),dir:j>i?P[P.length-1]:P[0],north:SD[t].lat>SD[f].lat}}
function findRoutes(a,b){const A=nearbyStations(a,4,1.4),B=nearbyStations(b,4,1.4),res=[];
  A.forEach(x=>B.forEach(y=>{if(x.s.id===y.s.id)return;const base=(x.d+y.d)*1000/75;
    x.s.lines.forEach(l=>{const r=ride(l,x.s.id,y.s.id);if(r)res.push({cost:base+r.stops*2.2+5,legs:[r],x,y})});
    x.s.lines.forEach(la=>{if(!LINE_PATH[la])return;y.s.lines.forEach(lb=>{if(!LINE_PATH[lb]||la===lb)return;LINE_PATH[la].forEach(t=>{if(t===x.s.id||t===y.s.id||!LINE_PATH[lb].includes(t))return;const r1=ride(la,x.s.id,t),r2=ride(lb,t,y.s.id);if(r1&&r2)res.push({cost:base+(r1.stops+r2.stops)*2.2+11,legs:[r1,r2],x,y,t})})})})}));
  res.sort((p,q)=>p.cost-q.cost);const seen=new Set(),out=[];for(const r of res){const k=r.legs.map(l=>l.line).join('>');if(seen.has(k))continue;seen.add(k);out.push(r);if(out.length>=3)break}return out}
function legTxt(r){const d=SD[r.dir];return `קו ${lineBadges([r.line])} לכיוון <b class="ltr">${esc(d?d.en:'')}</b> (${r.north?'Uptown — צפונה':'Downtown — דרומה'}), ${r.stops===1?'תחנה אחת':r.stops+' תחנות'}`}
function routeGo(){const a=resolve($('#rg-a').value),b=resolve($('#rg-b').value),out=$('#rg-out');
  if($('#rg-a').value===$('#rg-b').value){out.innerHTML='<div class="note">בחרו שני מקומות שונים.</div>';return}
  const dist=hav(a.ll,b.ll);let h=`<div class="cnt">מרחק בקו אווירי: ${dist.toFixed(1)} ק״מ</div>`;
  if(a.ap)h+=`<div class="note b">✈️ מהשדה: ${esc(a.ap.pre)}. מכאן ממשיכים:</div>`;
  if(b.ap)h+=`<div class="note b">✈️ לשדה: בסוף הנסיעה — ${esc(b.ap.pre)}.</div>`;
  if(dist<1.3)h+=`<div class="note g">🚶 קרוב מאוד — כ-${Math.round(dist*1000/75)} דקות ברגל.</div>`;
  const rs=findRoutes(a.ll,b.ll);
  if(!rs.length&&dist>=1.3)h+='<div class="note">לא נמצא קו ישיר או עם החלפה אחת. נסו את הקישור ל-Google Maps למטה, או מונית.</div>';
  rs.forEach((r,i)=>{const mins=Math.round(r.cost);h+=`<div class="card" style="padding:10px;margin:6px 0"><b>אפשרות ${i+1} · כ-${mins} דקות · $3</b><div style="margin-top:4px">🚶 ${Math.round(r.x.d*1000/75)} דק׳ ברגל אל <b class="ltr">${esc(r.x.s.en)}</b> <small>(${esc(r.x.s.he)})</small></div>${r.legs.map((l,k)=>`<div>${k?'🔁 החלפה ב-<b class="ltr">'+esc(SD[r.t.id||r.t].en)+'</b>:<br>':'🚇 '}${legTxt(l)}</div>`).join('')}<div>⬇️ ירידה ב-<b class="ltr">${esc(r.y.s.en)}</b> <small>(${esc(r.y.s.he)})</small> ואז 🚶 ${Math.round(r.y.d*1000/75)} דק׳ ברגל ליעד</div></div>`});
  if(rs.length)h+='<div class="cnt">שימו לב: בדקו אם הרכבת עוצרת בתחנה (אקספרס או מקומי) ואם יש שינויים בשירות.</div>';
  h+=`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${a.ll[0]},${a.ll[1]}&destination=${b.ll[0]},${b.ll[1]}&travelmode=transit">🧭 מסלול מדויק ב-Google Maps (תחבורה ציבורית)</a><a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${a.ll[0]},${a.ll[1]}&destination=${b.ll[0]},${b.ll[1]}&travelmode=driving">🚕 במונית</a></div><div class="cnt">זמן במונית משוער: כ-${Math.round(6+dist*3.5)} דקות (תלוי בעומס).</div>`;
  out.innerHTML=h}

    let seed=avail[0];if(d===0)seed=avail.slice(0,6).sort((a,b)=>(b.sc-hav(H,b.s.ll)*0.8)-(a.sc-hav(H,a.s.ll)*0.8))[0];
    const chosen=[seed.s];let slots=slotsOf(seed.s);used.add(seed.s.id);
    while(slots<cap){const last=chosen[chosen.length-1];
      const c=avail.filter(x=>!used.has(x.s.id)&&slots+slotsOf(x.s)<=cap+0.01&&hav(seed.s.ll,x.s.ll)<=(sat?2.2:maxR)).sort((a,b)=>(b.sc-hav(last.ll,b.s.ll)*0.9)-(a.sc-hav(last.ll,a.s.ll)*0.9))[0];
      if(!c)break;chosen.push(c.s);used.add(c.s.id);slots+=slotsOf(c.s)}
    /* סדר ביום: הליכה קרובה מהמלון, מופע בסוף */
    const rest=chosen.filter(s=>s.k!=='show'),shows=chosen.filter(s=>s.k==='show'),ord=[];let p=H,arr=rest.slice();
    while(arr.length){arr.sort((a,b)=>hav(p,a.ll)-hav(p,b.ll));const n=arr.shift();ord.push(n);p=n.ll}
    shows.forEach(s=>ord.push(s));
    /* שעות */
    let t=(o.pace===1?10:9.5)*60,lunch=false,tRest=t;p=H;const stops=[];
    ord.forEach(s=>{const dist=hav(p,s.ll);const go=legInfo(dist,o,sat);t+=go.min;
      if(s.k==='show')t=Math.max(t,19.5*60);
      if(!lunch&&t>=12.4*60&&s.k!=='show'){const rs=pickLunch(p,o,usedR);if(rs)usedR.add(rs.id);stops.push({time:fmtT(t),lunch:rs});t+=60;lunch=true;const g2=legInfo(hav(rs?rs.ll:p,s.ll),o,sat);t+=Math.round(g2.min*0.5)}
      stops.push({time:fmtT(t),site:s,go:go.txt});t+=durOf(s);if(s.k!=='show')tRest=t;p=s.ll});
    if(!lunch&&ord.some(s=>s.k!=='show')){const rs=pickLunch(ord.filter(s=>s.k!=='show').slice(-1)[0].ll,o,usedR);if(rs){usedR.add(rs.id);let at=stops.findIndex(x=>x.site&&x.site.k==='show');if(at<0)at=stops.length;stops.splice(at,0,{time:fmtT(Math.max(tRest,12.5*60)),lunch:rs})}}
    const dn=pickDinner(p,o,usedR);if(dn&&!ord.some(s=>s.k==='show')){usedR.add(dn.id);stops.push({time:fmtT(Math.max(t+20,18*60)),dinner:dn})}
    day.stops=sat?stops.filter(x=>!('lunch' in x)&&!x.dinner):stops;day.ll=ord.map(s=>s.ll);day.start=H;
    if(sat)day.notes.push('שבת: מסלול רגלי בלבד, בלי נסיעות ובלי רכישת כרטיסים. אוכל — במלון או לידו.');
    if(fri)day.notes.push('יום שישי: סיימו בזמן לפני כניסת שבת וחזרו למלון בהליכה.');
    if(d===0&&o.arr)day.notes.push('יום נחיתה: מסלול קל. השאירו זמן להתארגנות במלון ולהתאושש מהטיסה.');
    if(d===o.days-1&&o.dep&&o.days>1)day.notes.push('יום עזיבה: מסלול קל ובקרבת המלון. בדקו שעת יציאה לשדה (כ-3 שעות לפני הטיסה).');

  return {o:{...o,date:o.date?o.date.getTime():null},days:days.map(d=>({...d,stops:d.stops.map(s=>({time:s.time,sid:s.site?s.site.id:null,go:s.go,lid:s.lunch?s.lunch.id:null,did:s.dinner?s.dinner.id:null}))})),oid:o.hotel,built:Date.now()}}
function fmtT(m){m=Math.round(m/5)*5;return pad(Math.floor(m/60)%24)+':'+pad(m%60)}
function legInfo(d,o,sat){if(d<0.05)return{min:0,txt:''};const walk=Math.round(d*1000/75),taxi=Math.round(6+d*3.5),metro=Math.round(12+d*2.2);
  if(sat||d<0.9&&o.walk!=='low')return{min:walk,txt:`🚶 ${walk} דק׳ ברגל (${d.toFixed(1)} ק״מ)`};
  if(o.walk==='low'&&d<0.45)return{min:walk,txt:`🚶 ${walk} דק׳ ברגל`};
  if(d<3.2&&o.walk!=='low')return{min:metro,txt:`🚇 מטרו/אוטובוס כ-${metro} דק׳ (או מונית ${taxi} דק׳)`};
  return{min:taxi,txt:`🚕 מונית כ-${taxi} דק׳ (או מטרו כ-${metro} דק׳)`}}
function pickLunch(p,o,u){u=u||new Set();const l=RESTS.filter(r=>!HID.has(r.id)&&!u.has(r.id));let c=l.filter(r=>r.pr.length<=3&&r.cu!=='fine'&&(!o.kosher||r.cu==='kosher'));
  if(o.kosher){const k=c.filter(r=>hav(p,r.ll)<3.5);return k.sort((a,b)=>hav(p,a.ll)-hav(p,b.ll))[0]||null}
  return c.sort((a,b)=>hav(p,a.ll)-hav(p,b.ll))[0]||null}
function pickDinner(p,o,u){u=u||new Set();const l=RESTS.filter(r=>!HID.has(r.id)&&!u.has(r.id)&&(!o.kosher||r.cu==='kosher'));return l.filter(r=>hav(p,r.ll)<2.5).sort((a,b)=>hav(p,a.ll)-hav(p,b.ll))[0]||null}
function planText(P){const o=P.o;let t=`מסלול ${o.days} ימים בניו יורק — יוצר: יעקב זוהר\nנוסעים: ${o.ad} מבוגרים${o.kd?`, ${o.kd} ילדים`:''}\n\n`;
  P.days.forEach(d=>{t+=`יום ${d.n}${d.date?' — '+d.wd+' '+d.date:''}\n`;if(d.outlet)t+=`  • ${d.outlet.n} (${d.outlet.ad})\n`;if(d.free)t+='  • יום חופשי: שוק, קניות או סנטרל פארק לפי הרצון\n';
    d.stops.forEach(s=>{if(s.sid){const x=REG[s.sid].item;t+=`  ${s.time}  ${x.n} (${x.e}) — ${x.ad}\n`;}else if(s.lid){const x=REG[s.lid].item;t+=`  ${s.time}  ארוחת צהריים: ${x.n} — ${x.ad}\n`}else if(s.did){const x=REG[s.did].item;t+=`  ${s.time}  ארוחת ערב: ${x.n} — ${x.ad}\n`}});d.notes.forEach(n=>t+=`  * ${n}\n`);t+='\n'});
  return t}

const DAY_COLS=['#2563eb','#dc2626','#16a34a','#ca8a04','#7c3aed','#db2777','#0d9488','#ea580c','#4f46e5','#0891b2','#be123c','#65a30d','#9333ea','#c2410c','#0369a1'];
let PLAN_MAP=null, PLAN_MAP_LAYERS=[];
function collectDayPoints(d){
  const pts=[];
  if(d.start)pts.push(d.start);
  (d.stops||[]).forEach(s=>{
    if(s.sid&&REG[s.sid]&&REG[s.sid].item.ll)pts.push(REG[s.sid].item.ll);
    else if(s.lid&&REG[s.lid]&&REG[s.lid].item.ll)pts.push(REG[s.lid].item.ll);
    else if(s.did&&REG[s.did]&&REG[s.did].item.ll)pts.push(REG[s.did].item.ll);
  });
  if(d.ll&&d.ll.length){d.ll.forEach(ll=>{if(ll&&!pts.some(p=>p[0]===ll[0]&&p[1]===ll[1]))pts.push(ll)})}
  return pts;
}
function clearPlanMapLayers(){
  if(!PLAN_MAP)return;
  PLAN_MAP_LAYERS.forEach(l=>{try{PLAN_MAP.removeLayer(l)}catch(e){}});
  PLAN_MAP_LAYERS=[];
}
function ensurePlanMap(){
  const box=$('#planmap');if(!box)return null;
  // אם ה-DOM נבנה מחדש — צריך מפה חדשה
  if(PLAN_MAP && PLAN_MAP.getContainer && PLAN_MAP.getContainer()!==box){
    try{PLAN_MAP.remove()}catch(e){}
    PLAN_MAP=null;PLAN_MAP_LAYERS=[];
  }
  if(PLAN_MAP){PLAN_MAP.invalidateSize();return PLAN_MAP}
  if(typeof L==='undefined'){
    box.innerHTML='<div class="empty">המפה דורשת חיבור. אפשר להשתמש בקישורי Google Maps לכל יום.</div>';
    return null;
  }
  PLAN_MAP=L.map(box,{scrollWheelZoom:true}).setView([40.75,-73.98],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(PLAN_MAP);
  setTimeout(()=>PLAN_MAP.invalidateSize(),200);
  return PLAN_MAP;
}
function drawPlanOnMap(P, dayIndex){
  const map=ensurePlanMap();if(!map||!P)return;
  clearPlanMapLayers();
  const bounds=[];
  const days=(dayIndex==null)?P.days:[P.days[dayIndex]].filter(Boolean);
  days.forEach((d,idx)=>{
    const di=(dayIndex==null)?P.days.indexOf(d):dayIndex;
    const col=DAY_COLS[di%DAY_COLS.length];
    const pts=collectDayPoints(d);
    if(pts.length<1)return;
    pts.forEach(p=>bounds.push(p));
    if(pts.length>=2){
      const pl=L.polyline(pts,{color:col,weight:4,opacity:0.85}).addTo(map);
      PLAN_MAP_LAYERS.push(pl);
    }
    pts.forEach((pt,pi)=>{
      const label=(pi===0&&d.start)?'בסיס':String(pi);
      const mk=L.marker(pt,{icon:L.divIcon({className:'',html:`<div class="day-dot" style="background:${col}">${label}</div>`,iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map);
      let title='יום '+(d.n|| (di+1));
      if(pi>0){
        const stop=(d.stops||[])[pi-1];
        if(stop&&stop.sid&&REG[stop.sid])title+=' · '+REG[stop.sid].item.n;
      }
      mk.bindPopup(`<b>${esc(title)}</b>`);
      PLAN_MAP_LAYERS.push(mk);
    });
  });
  if(bounds.length)map.fitBounds(bounds,{padding:[30,30]});
  const leg=$('#planmap-legend');
  if(leg){
    if(dayIndex==null){
      leg.innerHTML=P.days.map((d,i)=>`<span class="chip on" style="background:${DAY_COLS[i%DAY_COLS.length]};color:#fff;border:0">יום ${d.n}</span>`).join(' ');
    }else{
      leg.innerHTML=`<span class="chip on" style="background:${DAY_COLS[dayIndex%DAY_COLS.length]};color:#fff;border:0">יום ${P.days[dayIndex].n} בלבד</span>`;
    }
  }
}

      if(String(id).startsWith('stn:')){const s=SD[id.slice(4)];return `<div class="pick-item" data-stn="${s.id}"><span class="em">🚇</span><div><b class="ltr">${esc(s.en)}</b><div class="cnt">${esc(s.he)} · ${s.lines.join(' ')}</div></div></div>`;}

      return `<div class="pick-item" data-pid="${id}"><span class="em">${i.em||'📍'}</span><div><b>${esc(i.n)}</b>${i.e?`<div class="cnt ltr">${esc(i.e)}</div>`:''}<div class="cnt">${esc(areaTxt(r)||'')}</div></div></div>`;
    }).join('')||'<div class="empty">אין פריטים</div>'}</div>
    <div style="margin-top:10px" class="cnt">לאחר בחירה המפה תתמקד במקום. אפשר גם לבקש מסלול הגעה.</div>`;
  }
  render();
  $('#pickModal').classList.add('on');
  sheet.onclick=e=>{
    const catB=e.target.closest('[data-pkcat]');if(catB){curK=catB.dataset.pkcat;render();return}
    if(e.target.closest('[data-act=closepick]')){closePick();return}
    const it=e.target.closest('[data-pid]');
    if(it){const id=it.dataset.pid;closePick();flyToPlace(id);return}
    const st=e.target.closest('[data-stn]');
    if(st){closePick();flyToStation(st.dataset.stn)}
  };
}
function closePick(){$('#pickModal').classList.remove('on')}
function flyToPlace(id){
  go('map');setTimeout(()=>{
    if(!MAP)initMap();
    const r=REG[id];if(!r||!r.item.ll)return toast('אין מיקום במפה');
    layerOn[r.type]=1;LS.s('layers',layerOn);refreshMapLayers();
    MAP.setView(r.item.ll,16);
    // open popup of matching marker if possible
    setTimeout(()=>{
      MAP.eachLayer(l=>{if(l.getPopup&&l.getLatLng&&l.getLatLng().lat===r.item.ll[0]){l.openPopup()}});
    },400);
    toast(r.item.n+' · במפה');
    // offer directions
    setTimeout(()=>{
      if(confirm('לפתוח מסלול הגעה ל'+r.item.n+' ב-Google Maps?'))window.open(mapsDir(r.item),'_blank');
    },600);
  },100);
}
function flyToStation(id){
  go('map');setTimeout(()=>{
    if(!MAP)initMap();
    layerOn.stn=1;LS.s('layers',layerOn);refreshMapLayers();
    const s=SD[id];MAP.setView([s.lat,s.lng],16);
    toast(s.en);
  },100);
}
function toggleFs(boxId){
  const box=$(boxId);if(!box)return;
  const isFs=box.classList.contains('fs');
  if(isFs){
    box.classList.remove('fs');
    const ex=$('.fs-exit');if(ex)ex.remove();
    if(boxId==='#mapbox'&&MAP)setTimeout(()=>MAP.invalidateSize(),200);
    if(boxId==='#metrobox'&&MET)setTimeout(()=>MET.invalidateSize(),200);
    if(boxId==='#planmap'&&PLAN_MAP)setTimeout(()=>PLAN_MAP.invalidateSize(),200);
  }else{
    box.classList.add('fs');
    const btn=document.createElement('button');btn.className='fs-exit';btn.textContent='✕ יציאה ממסך מלא';
    btn.onclick=()=>toggleFs(boxId);
    document.body.appendChild(btn);
    if(boxId==='#mapbox'&&MAP)setTimeout(()=>MAP.invalidateSize(),200);
    if(boxId==='#metrobox'&&MET)setTimeout(()=>MET.invalidateSize(),200);
    if(boxId==='#planmap'&&PLAN_MAP)setTimeout(()=>PLAN_MAP.invalidateSize(),200);
  }
}
function doToday(){
  const now=new Date();
  const wd=now.getDay(); // 0 Sun
  const wx=WX&&WX.cur?WX.cur:null;
  const code=wx?wx.weather_code:1;
  const temp=wx?Math.round(wx.temperature_2m):null;
  const rainy=[51,53,55,61,63,65,80,81,82,95,96,99].includes(code);
  const cold=temp!=null&&temp<8;
  const hot=temp!=null&&temp>28;
  let recs=[];
  // prefer saved plan day matching today if exists
  if(LASTPLAN&&LASTPLAN.o&&LASTPLAN.o.date){
    const start=new Date(LASTPLAN.o.date);
    const diff=Math.floor((now.setHours(0,0,0,0)-new Date(start).setHours(0,0,0,0))/864e5);
    if(diff>=0&&diff<LASTPLAN.days.length){
      const day=LASTPLAN.days[diff];
      recs.push({title:'מתוך המסלול שלך – יום '+(diff+1),items:day.stops.filter(s=>s.sid).map(s=>({id:s.sid,time:s.time}))});
    }
  }
  // weather / day based
  let pool=SITES.filter(s=>!HID.has(s.id));
  if(rainy||cold) pool=pool.filter(s=>(s.tags||[]).includes('indoor')||s.k==='museum'||s.k==='show'||s.k==='shop');
  else if(hot) pool=pool.filter(s=>(s.tags||[]).includes('indoor')||s.k==='park'||s.id==='cpark'||s.k==='view');
  if(wd===5||wd===6){ // weekend – more outdoor / iconic
    pool.sort((a,b)=>((b.tags||[]).includes('must')?2:0)-((a.tags||[]).includes('must')?2:0));
  }
  const top=pool.filter(s=>(s.tags||[]).includes('must')||s.k==='icon'||s.k==='view').slice(0,6);
  if(!top.length) top.push(...pool.slice(0,5));
  recs.push({title:'המלצות להיום'+(temp!=null?` · ${temp}°C`:'' )+(rainy?' · גשום – מומלץ בפנים':cold?' · קר':hot?' · חם':''),items:top.map(s=>({id:s.id}))});
  // lunch ideas
  const lunch=RESTS.filter(r=>!HID.has(r.id)&&r.pr.length<=3).slice(0,3);
  const sheet=$('#sheet');
  let h=`<button class="x" data-act="close">✕</button><div class="db" style="padding-top:40px"><h2>✨ מה עושים היום</h2>
  <div class="cnt">${DAYS[wd]} · ${fmtDate(now)}${temp!=null?` · עכשיו ${temp}°C`:''}</div>`;
  recs.forEach(r=>{
    h+=`<div class="day-rec"><b>${esc(r.title)}</b>`;
    r.items.forEach(it=>{
      const rr=REG[it.id];if(!rr)return;
      h+=`<div style="margin:6px 0;display:flex;gap:8px;align-items:center"><span>${rr.item.em||'📍'}</span><a href="#" data-act="open" data-id="${it.id}">${esc(rr.item.n)}</a>${it.time?`<span class="cnt">${it.time}</span>`:''}<button class="btn alt sm" data-act="fly" data-id="${it.id}">מפה</button></div>`;
    });
    h+='</div>';
  });
  if(lunch.length){
    h+=`<div class="day-rec"><b>🍽️ רעיונות לארוחה</b>${lunch.map(r=>`<div style="margin:4px 0"><a href="#" data-act="open" data-id="${r.id}">${r.em} ${esc(r.n)}</a> <span class="cnt">${esc(r.pr)} · ${esc(CUISINES[r.cu]||'')}</span></div>`).join('')}</div>`;
  }
  h+=`<div class="note">ההמלצות מתחשבות במזג האוויר, ביום בשבוע${LASTPLAN?', ובמסלול ששמרתם':''}. לחצו על מקום לפרטים או על ״מפה״ כדי לראות אותו במפה.</div>
  <div style="margin-top:10px"><button class="btn" data-act="close">סגור</button> <button class="btn alt" onclick="go('plan')">📅 למסלולים</button></div></div>`;
  sheet.innerHTML=h;$('#modal').classList.add('on');
  sheet.addEventListener('click',function handler(e){
    const b=e.target.closest('[data-act=fly]');
    if(b){e.preventDefault();closeDetail();flyToPlace(b.dataset.id)}
  },{once:false});
}

// wire buttons after DOM ready (called from existing init)
function wireEnhancements(){
  const dt=$('#doToday');if(dt)dt.onclick=doToday;
  const pm=$('#pickOnMap');if(pm)pm.onclick=openPickPlace;
  const mf=$('#mapFs');if(mf)mf.onclick=()=>toggleFs('#mapbox');
  const mtf=$('#metroFs');if(mtf)mtf.onclick=()=>toggleFs('#metrobox');
  $('#pickModal').addEventListener('click',e=>{if(e.target.id==='pickModal')closePick()});
}

/* ================= אתחול ================= */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
  if(act==='open'){e.preventDefault();window._curId=id;if($('#modal').classList.contains('on')){const sc=1;}openDetail(id)}
  else if(act==='close'){history.state&&history.state.m?history.back():closeDetail()}
  else if(act==='fav'){toggleFav(id)}else if(act==='hide')hideItem(id);else if(act==='unhide')unhideItem(id);else if(act==='delc')delCustom(id);
  else if(act==='addplace')openAddPlace();
  else if(act==='plcopy'&&LASTPLAN){navigator.clipboard&&navigator.clipboard.writeText(planText(LASTPLAN)).then(()=>toast('המסלול הועתק'))}
  else if(act==='plsave'&&LASTPLAN){savePlanFile(LASTPLAN)}
  else if(act==='plshare'&&LASTPLAN){sharePlan(LASTPLAN)}
  else if(act==='plprint'){printPlanPdf()}
  else if(act==='plmapall'&&LASTPLAN){drawPlanOnMap(LASTPLAN,null);toast('כל הימים על המפה')}
  else if(act==='plmapday'&&LASTPLAN){drawPlanOnMap(LASTPLAN,+a.dataset.di);toast('יום '+(+a.dataset.di+1)+' על המפה')}
  else if(act==='plmapfs'){const box=$('#planmap');if(!box)return;toggleFs('#planmap');setTimeout(()=>{if(PLAN_MAP)PLAN_MAP.invalidateSize()},250)}
  else if(act==='plsave-named'&&LASTPLAN){
    const name=prompt('שם למסלול השמור:', (LASTPLAN.o&&LASTPLAN.o.days?LASTPLAN.o.days+' ימים':'מסלול')+' — '+fmtDate(new Date()));
    if(!name)return;
    SAVED_PLANS.unshift({name, savedAt:Date.now(), ...JSON.parse(JSON.stringify(LASTPLAN))});
    if(SAVED_PLANS.length>20)SAVED_PLANS.length=20;
    savePlansStore();renderSavedPlans();toast('המסלול נשמר במכשיר');
  }
  else if(act==='plload'){const i=+a.dataset.i;const p=SAVED_PLANS[i];if(!p)return;LASTPLAN=JSON.parse(JSON.stringify(p));delete LASTPLAN.name;delete LASTPLAN.savedAt;LS.s('plan',LASTPLAN);PLAN_EDIT=false;showPlan(LASTPLAN);toast('המסלול נטען');$('#pl-out')&&$('#pl-out').scrollIntoView({behavior:'smooth'})}
  else if(act==='pldel'){const i=+a.dataset.i;if(!confirm('למחוק את המסלול השמור?'))return;SAVED_PLANS.splice(i,1);savePlansStore();renderSavedPlans();toast('נמחק')}
  else if(act==='pledit'&&LASTPLAN){PLAN_EDIT=!PLAN_EDIT;showPlan(LASTPLAN);toast(PLAN_EDIT?'מצב עריכה פעיל':'עריכה הסתיימה · לחצו «שמור מסלול» כדי לשמור')}
  else if(act==='plrm'&&LASTPLAN){const di=+a.dataset.di,si=+a.dataset.si;if(!LASTPLAN.days[di])return;LASTPLAN.days[di].stops.splice(si,1);LS.s('plan',LASTPLAN);showPlan(LASTPLAN)}
  else if(act==='plup'&&LASTPLAN){const di=+a.dataset.di,si=+a.dataset.si;const st=LASTPLAN.days[di]&&LASTPLAN.days[di].stops;if(!st||si<=0)return;const t=st[si-1];st[si-1]=st[si];st[si]=t;LS.s('plan',LASTPLAN);showPlan(LASTPLAN)}
  else if(act==='pldn'&&LASTPLAN){const di=+a.dataset.di,si=+a.dataset.si;const st=LASTPLAN.days[di]&&LASTPLAN.days[di].stops;if(!st||si>=st.length-1)return;const t=st[si+1];st[si+1]=st[si];st[si]=t;LS.s('plan',LASTPLAN);showPlan(LASTPLAN)}
  else if(act==='pldocadd'&&LASTPLAN){
    const url=($('#pl-doc-url')&&$('#pl-doc-url').value||'').trim();
    const desc=($('#pl-doc-desc')&&$('#pl-doc-desc').value||'').trim();
    if(!url)return toast('הזינו קישור למסמך או לתמונה');
    if(!LASTPLAN.docs)LASTPLAN.docs=[];
    LASTPLAN.docs.push({url,desc});LS.s('plan',LASTPLAN);showPlan(LASTPLAN);toast('הקישור נוסף');
  }
  else if(act==='pldocrm'&&LASTPLAN){const di=+a.dataset.di;if(!LASTPLAN.docs)return;LASTPLAN.docs.splice(di,1);LS.s('plan',LASTPLAN);showPlan(LASTPLAN);toast('הקישור הוסר')}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){history.state&&history.state.m?history.back():closeDetail()}});
window.addEventListener('popstate',()=>closeDetail());

buildShell();buildMapPane();buildSites();buildHotels();buildTransit();buildRest();buildFood();buildShop();buildMarkets();buildTips();buildPlan();buildEvents();buildInfo();
